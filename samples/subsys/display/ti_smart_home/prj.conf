# Base LVGL/display tuning carried over unchanged from
# zephyr/samples/modules/lvgl/demos/prj.conf, already proven working on this
# board with the lv_demo_music sample.
CONFIG_MAIN_STACK_SIZE=35480
CONFIG_LOG=y
CONFIG_SHELL=y

CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=8097152
CONFIG_LV_Z_SHELL=y
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=y
CONFIG_FAST_OPTIMIZATIONS=y
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=y
CONFIG_LV_COLOR_DEPTH_32=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_DRAW_LAYER_SIMPLE_BUF_SIZE=1486432
CONFIG_MIPI_DSI=y
# CONFIG_LV_LOG_LEVEL_WARN=y
# CONFIG_LV_LOG_LEVEL_TRACE=y

CONFIG_DISPLAY=y
CONFIG_INPUT=y

CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_SHELL=y

CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LV_Z_FLUSH_THREAD_STACK_SIZE=35480
CONFIG_LV_Z_LVGL_WORKQUEUE_STACK_SIZE=35480
CONFIG_INPUT_QUEUE_MAX_MSGS=50

# Widgets and features used by the ti-smart-home UI (see components/ and
# ti_smart_home.c: arc thermostat, EV charge bar/chart, buttons, checkboxes,
# images, labels, sliders, switches, subject/observer data binding, and
# lv_obj_find_by_name lookups in the contact/music callbacks).
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_CHECKBOX=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_OBSERVER=y
# Float-type subjects, used by custom/thermostat_logic.c's lv_subject_get_float
# calls for the derived climate state (auto-mode changeover). Not implied by
# LV_USE_OBSERVER - each subject type (bool/int/float/color/...) is separate.
CONFIG_LV_USE_FLOAT=y
CONFIG_LV_USE_OBJ_NAME=y
# CONFIG_INPUT_EVENT_DUMP=y
# CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_INPUT_GT911_MAX_TOUCH_POINTS=1